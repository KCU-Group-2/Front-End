function login(){return `<div class="auth"><aside class="auth-brand">${brand()}<div class="auth-copy"><h1>Share what you made.<br>Unlock what you need.</h1><p>A study resource exchange for UW–Madison students. Upload your notes, earn points, and learn with an AI assistant grounded in real course material.</p><div class="auth-stats"><div><strong>1,240</strong><small>Resources</small></div><div><strong>312</strong><small>Courses</small></div><div><strong>860</strong><small>Students</small></div></div></div></aside><section class="auth-form"><div class="auth-inner"><div class="tabs"><button class="${!signup?'active':''}" onclick="signup=false;render()">Log in</button><button class="${signup?'active':''}" onclick="signup=true;render()">Sign up</button></div><h1>${signup?'Join StudySwap':'Welcome back'}</h1><p>${signup?'Create an account with your UW–Madison email.':'Log in with your UW–Madison email.'}</p><form id="login-form">${signup?'<label class="field">Name<input name="name" placeholder="Bucky Badger" required></label>':''}<label class="field">Email<input name="email" type="email" placeholder="bucky@wisc.edu" required pattern="[^@]+@wisc\\.edu" title="Use a wisc.edu email address"></label><div class="row between field"><label for="password">Password</label><button type="button" class="link" onclick="modal('<h2>Password reset</h2><p>This prototype does not store passwords or send email. Use Enter demo to explore StudySwap.</p>')">Forgot password?</button></div><input id="password" name="password" type="password" autocomplete="${signup?'new-password':'current-password'}" placeholder="••••••••••" minlength="8" required style="margin:8px 0 26px"><button class="btn dark full">${signup?'Create account · 50 starter points':'Log in'}</button></form><div class="or">or</div><button class="btn full" onclick="modal('<h2>UW–Madison NetID</h2><p>School sign-in requires an authorized university integration. No credentials are sent by this prototype.</p>')">Continue with NetID</bu function resourceRow(r,mode='course'){return `<a class="resource" href="#resource/${r.id}">${pdf()}<div class="grow"><h3>${esc(r.title)}</h3><small>${mode==='home'?cby(r.course).code:'Prof. Kim'} · Fall 2025 · ${mode==='home'?r.type:r.pages+' pages'}</small></div>${mode==='home'?tags(r.tags):`<span class="tag">${r.type}</span><strong style="white-space:nowrap">${state.unlocked.includes(r.id)?'<span class="tag green">Unlocked</span>':r.cost+' pts'}</strong>`}</a>`}
function home(){return `<main class="main grid home"><section><h1>Good afternoon, Bucky</h1><p>Find a course, or pick up where you left off.</p><form class="search" id="home-search"><span>⌕</span><input name="q" aria-label="Search courses" placeholder="Search courses or describe what you want to learn..."><button class="chip">AI search</button></form><div class="section-title"><h2>My courses</h2><button class="link" onclick="editCourses()">Edit</button></div><div class="courses-mini">${state.mycourses.map(id=>{let c=cby(id);return `<a class="panel course-mini" href="#course/${c.id}"><small>${c.code}</small><h3>${c.title}</h3><small>${c.count} resources</small></a>`}).join('')||'<p>No courses yet. Find a course to get started.</p>'}</div><div class="section"><div class="section-title"><h2>Recently added</h2><a class="link" href="#courses">View all</a></div><div class="panel list">${['exam','sql','eigen'].map(id=>resourceRow(rby(id),'home')).join('')}</div></div></section><aside class="stack"><div class="panel"><small>Your points</small><div class="metric">${state.points}</div><div class="progress"><i></i></div><p style="font-size:14px">Upload 1 more resource to earn +30</p>${btn('Upload a resource','upload','dark full')}</div><div class="panel"><h2>Recommended for you</h2>${['bootstrap','tree','review'].map(id=>{let r=rby(id);return `<a class="rec" href="#resource/${id}">${pdf()}<div><h3>${r.title}</h3><small>${cby(r.course).code} · ${r.cost} pts</small></div></a>`}).join('')}</div></aside></main>`}
function editCourses(){modal(`<h2>My courses</h2><p>Choose the courses shown on your home page.</p>${courses.map(c=>`<label class="check"><input type="checkbox" ${state.mycourses.includes(c.id)?'checked':''} onchange="toggleCourse('${c.id}',this.checked)">${c.code} · ${c.title}</label>`).join('')}`)}function toggleCourse(id,on){state.mycourses=on?[...new Set([...state.mycourses,id])]:state.mycourses.filter(x=>x!==id);render()}
function coursesPage(){return `<main class="main narrow"><h1>Find a course</h1><div class="row between wrap section"><div class="tabs">${['Keyword','AI search'].map(t=>`<button class="${searchMode===t?'active':''}" onclick="searchMode='${t}';render()">${t}</button>`).join('')}</div><div class="tags"><select id="level" aria-label="Course level" style="width:auto;padding:7px"><option>Any level</option><option>Introductory</option><option>Intermediate</option><option>Advanced</option></select><span class="tag">3–4 credits</span><span class="tag">Fall 2026</span></div></div><form class="search" id="course-search" style="border-color:#17191d"><span>⌕</span><input id="query" name="q" aria-label="Course search" value="${esc(window.courseQuery??'')}" placeholder="${searchMode==='AI search'?'I want to learn about databases and how to design them':'Search by course name or code'}"><button class="btn dark">Search</button></form><p class="muted" id="result-summary"></p><div id="course-results"></div></main>`}
function showCourseResults(){let q=($('#query')?.value||'').toLowerCase();window.courseQuery=q;let words=q.split(/\W+/).filter(w=>w.length>2&&!['want','learn','about','and','how','them','the','for','with'].includes(w));let list=courses.map(c=>({...c,score:words.reduce((a,w)=>a+((c.title+' '+c.desc+' '+c.code).toLowerCase().includes(w.replace(/s$/,''))?1:0),0)}));if(words.length)list=list.filter(c=>c.score>0).sort((a,b)=>b.score-a.score);let level=$('#level').value;list=list.filter(c=>level==='Any level'||(level==='Introductory'?c.id==='stat240':level==='Advanced'?c.id.startsWith('cs'):!c.id.startsWith('cs')&&c.id!=='stat240'));$('#result-summary').textContent=`${list.length} courses${searchMode==='AI search'?' · Demo relevance ranking using course keywords (AI not connected)':''}`;$('#course-results').innerHTML=list.map((c,i)=>`<article class="panel result">${searchMode==='AI search'?`<div class="score"><strong>${q?Math.max(60,94-i*11):'—'}</strong><small>match</small></div>`:''}<div class="grow"><h3>${c.code} · ${c.title} ${i===0&&q?'<span class="tag green">Best match</span>':''}</h3><p style="font-size:14px;margin:10px 0 14px">${c.desc}</p>${tags([c.credits+' credits',c.req==='None'?'No prerequisites':'Req: '+c.req,c.count+' resources'])}</div>${btn('View','course/'+c.id)}</article>`).join('')||'<div class="panel empty">No matching courses. Try “statistics”, “SQL”, or “linear algebra”.</div>'}
function coursePage(id){let c=cby(id);return `<main class="main"><div class="breadcrumb"><a href="#courses">Courses</a> / ${c.code}</div><div class="row between page-heading"><div><p style="margin-bottom:6px">${c.code}</p><h1>${c.title}</h1></div><div class="row wrap"><button class="btn" onclick="toggleCourse('${c.id}',${!state.mycourses.includes(c.id)});toast('My courses updated')">${state.mycourses.includes(c.id)?'✓ Added to my courses':'+ Add to my courses'}</button>${btn('Upload for this course','upload/'+c.id,'dark')}</div></div><div class="grid detail"><aside class="panel" style="align-self:start"><h2>About this course</h2><p>${c.desc}</p>${[['Credits',c.credits],['Prerequisites',c.req],['Level',c.id.startsWith('cs')?'Advanced':'Intermediate'],['Offered','Fall, Spring']].map(x=>`<div class="meta"><span>${x[0]}</span><strong>${x[1]}</strong></div>`).join('')}</aside><section><div class="section-title"><h2>Resources <small>${c.count}</small></h2><div class="tags">${['All','Study guide','Cheatsheet','Practice','Old exam','Notes'].map(t=>`<button class="chip ${filter===t?'active':''}" onclick="filter='${t}';render()">${t}</button>`).join('')}</div></div><div class="search" style="margin:18px 0"><span>⌕</span><input id="resource-search" placeholder="Search resources in ${c.code}" aria-label="Search resources"></div><div id="resources" class="panel list"></div></section></div></main>`}
function showResources(id){let q=$('#resource-search').value.toLowerCase();let list=resources.filter(r=>r.course===id&&(filter==='All'||r.type===filter)&&r.title.toLowerCase().includes(q));$('#resources').innerHTML=list.map(r=>resourceRow(r)).join('')||'<div class="empty">No resources match your filters.</div>'}
function resourcePage(id){let r=rby(id),c=cby(r.course),unlocked=state.unlocked.includes(r.id);return `<main class="main"><div class="breadcrumb"><a href="#courses">Courses</a> / <a href="#course/${c.id}">${c.code}</a> / ${r.title}</div><div class="grid preview-grid"><div class="paper-preview"><div class="papers"><article class="paper"><h2>${c.code} — ${r.title}</h2><small>Fall 2025 · Sample document</small><h3>1. ${r.tags[0]}</h3><p>${sampleContent(r)}</p><h3>2. Key ideas</h3><p>Connect the definitions to worked examples. Explain your reasoning and check the assumptions before applying a method.</p>${unlocked?'<h3>Practice</h3><p>Write a short explanation of the main concept, then construct an example and explain each step.</p>':''}</article><article class="paper ${unlocked?'':'obscured'}"><h2>Review & practice</h2><p>${unlocked?sampleContent(r):'Additional document content is available after unlocking this resource.'}</p><h3>Check your understanding</h3><p>What assumptions does the method require? How would you interpret the result in context?</p></article></div><div class="preview-caption"><strong>${unlocked?'Sample resource unlocked':'Preview shows page 1 of '+r.pages}</strong><p style="margin:8px 0 0">${unlocked?'The screenshots did not include original PDFs. This is demonstration content.':'Unlock to view the full sample resource'}</p></div></div><aside class="stack"><div class="panel"><span class="tag">${r.type}</span><h1 style="font-size:28px;margin-top:20px">${r.title}</h1><p>${r.id==='exam'?'Covers everything on Midterm 1: simple and multiple regression, residual diagnostics and interpretation of coefficients.':'Course notes and practice covering '+r.tags.join(', ')+'.'}</p>${[['Course',c.code],['Professor','Prof. Kim'],['Semester','Fall 2025'],['Pages',r.pages],['Uploaded by','jlee42 · 38 unlocks']].map(x=>`<div class="meta"><span>${x[0]}</span><strong>${x[1]}</strong></div>`).join('')}<small>AI topic tags · sample</small><div style="margin-top:10px">${tags(r.tags)}</div></div><div class="panel">${unlocked?`<span class="tag green">Unlocked</span><p style="margin-top:16px">Saved to My Library — no extra charge to reopen.</p>${btn('Ask about this resource','assistant/'+r.id,'dark full')}`:`<div class="row between"><span class="muted">Cost</span><h2>${r.cost} pts</h2></div><div class="row between"><small>Balance after unlock</small><small>${state.points} → ${state.points-r.cost}</small></div><button class="btn red full" style="margin-top:20px" onclick="unlock('${r.id}')" ${state.points<r.cost?'disabled':''}>Unlock for ${r.cost} points</button><p class="auth-note">Saved to My Library — no extra charge to reopen</p>${state.points<r.cost?'<p>Not enough points. Upload a resource to earn more.</p>':''}`}</div></aside></div></main>`}
function sampleContent(r){if(r.course==='cs564')return 'An INNER JOIN returns rows with matching keys in both tables. A LEFT JOIN keeps every row from the left table and fills unmatched right-side columns with NULL.';if(r.course==='math340')return 'An eigenvector v is a nonzero vector whose direction is preserved by a linear transformation A: Av = λv. Find eigenvalues by solving det(A − λI) = 0.';return 'Linear regression models the relationship between a response and explanatory variables. In y = β₀ + β₁x + ε, the slope describes the expected change in the response for a one-unit increase in x. Residuals are observed values minus fitted values.'}
function unlock(id){let r=rby(id);if(state.unlocked.includes(id))return;if(state.points<r.cost)return toast('Not enough points');state.points-=r.cost;state.spent+=r.cost;state.unlocked.push(id);render();toast('Resource unlocked and added to My Library')}
function uploadPage(id){return `<main class="main grid upload"><section class="panel"><h1>Upload a resource</h1><p>Only share material you made yourself or have permission to share. Approved uploads earn +30 points.</p><form id="upload-form"><div class="form-grid section"><label>Course<select name="course">${courses.map(c=>`<option value="${c.id}" ${id===c.id?'selected':''}>${c.code} · ${c.title}</option>`).join('')}</select></label><label>Semester<select name="semester"><option>Fall 2025</option><option>Spring 2026</option><option>Fall 2026</option></select></label><label>Professor<input name="professor" placeholder="Prof. Kim" required></label><label>Resource type<select name="type"><option>Notes</option><option>Study guide</option><option>Cheatsheet</option><option>Practice</option><option>Old exam</option></select></label></div><label class="field">Title<input name="title" placeholder="Bootstrap & Confidence Intervals — Lecture 8–10 Notes" required maxlength="150"></label><label class="field">File<div class="dropzone" id="dropzone"><input type="file" id="file" accept="application/pdf,.pdf" aria-label="Choose a PDF"><p id="file-info" style="margin:14px 0 0;font-size:14px">Choose or drop a PDF · Maximum 20 MB · Kept in this browser session only</p></div></label><label class="check"><input name="rights" type="checkbox" required>I created this material or have the right to share it.</label><div class="row wrap"><button class="btn dark">Submit for review</button><button type="button" class="btn" onclick="saveDraft()">Save draft</button></div></form></section><aside class="stack"><div class="panel"><div class="row between"><h2>AI upload review</h2><span class="tag amber">Demo</span></div><p style="font-size:14px">Example review signals. No AI analysis is performed.</p><div id="upload-review"><div class="review-item"><span class="tag">…</span><div><h3>Exact duplicate</h3><p>Select a file to check against uploads in this session.</p></div></div><div class="review-item"><span class="tag amber">!</span><div><h3>Similar documents</h3><p>Example: 71% similar to “Bootstrap CI Notes” — flagged for admin</p><div class="progress"><i style="width:71%;background:#ba7800"></i></div></div></div><div class="review-item"><span class="tag green">✓</span><div><h3>Matches course</h3><p>Sample course match: 0.82</p></div></div><div class="review-item"><span class="tag">…</span><div><h3>Topic tags</h3>${tags(['Bootstrap','Confidence interval','Resampling'])}</div></div></div></div><div class="panel"><small>WHAT HAPPENS NEXT</small><p style="margin:18px 0 0">AI check → Admin review → Approved → <strong class="green">+30 pts</strong></p></div></aside></main>`}
let draft=null;function saveDraft(){draft=Object.fromEntries(new FormData($('#upload-form')));toast('Draft saved for this visit')}
async function selectFile(f){if(!f)return;if(!f.name.toLowerCase().endsWith('.pdf')||f.size>20*1024*1024){currentFile=null;$('#file').value='';return toast('Choose a PDF smaller than 20 MB')}currentFile=f;let hash='';if(crypto.subtle)hash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',await f.arrayBuffer()))).map(x=>x.toString(16).padStart(2,'0')).join('');currentFile.fileHash=hash;let dup=hash&&state.uploads.some(x=>x.hash===hash);$('#file-info').textContent=`${f.name} · ${(f.size/1024/1024).toFixed(2)} MB · ${dup?'Duplicate of your session upload':'Ready for review'}`;$('#upload-review .review-item p').textContent=dup?'Identical file found in this session.':'No identical file found in this session'+(hash?' (SHA-256).':'.');}
function submitUpload(e){e.preventDefault();if(!currentFile)return toast('Please choose a PDF first');if(currentFile.fileHash&&state.uploads.some(x=>x.hash===currentFile.fileHash))return toast('This PDF has already been submitted');let d=Object.fromEntries(new FormData(e.target)),id='upload'+Date.now();state.uploads.unshift({...d,id,status:'Pending',hash:currentFile.fileHash,file:currentFile.name});fileURLs.set(id,URL.createObjectURL(currentFile));queue.unshift({id,title:d.title,course:cby(d.course).code,user:'bucky',flag:'Pending review'});currentFile=null;selectedQueue=0;toast('Submitted to the demo review queue. Points are awarded after approval.');libTab='My uploads';go('library')}
function libraryPage(){return `<main class="main"><div class="row between page-heading"><div><h1>My Library</h1><p>Resources you've unlocked are yours to reopen anytime — no extra points.</p></div><div class="stats"><div><small>Unlocked</small><strong>${state.unlocked.length}</strong></div><div><small>Uploaded</small><strong>${state.uploads.length}</strong></div><div><small>Points spent</small><strong>${state.spent}</strong></div></div></div><div class="row between wrap"><div class="tabs">${['Unlocked','My uploads'].map(t=>`<button class="${libTab===t?'active':''}" onclick="libTab='${t}';render()">${t}</button>`).join('')}</div><div class="row wrap"><div class="tags">${[['all','All courses'],...courses.slice(0,3).map(c=>[c.id,c.code])].map(([id,t])=>`<button class="chip ${libCourse===id?'active':''}" onclick="libCourse='${id}';render()">${t}</button>`).join('')}</div><input id="library-search" aria-label="Search library" placeholder="Search library" style="width:210px;padding:10px 15px"></div></div><div class="library-grid" id="library-results"></div></main>`}
function showLibrary(){let q=$('#library-search').value.toLowerCase(),list=(libTab==='Unlocked'?resources.filter(r=>state.unlocked.includes(r.id)):state.uploads).filter(r=>(libCourse==='all'||r.course===libCourse)&&r.title.toLowerCase().includes(q));$('#library-results').innerHTML=list.map(r=>`<article class="panel library-card"><a class="library-art" href="${libTab==='Unlocked'?'#resource/'+r.id:fileURLs.get(r.id)||'#library'}" ${libTab==='My uploads'?'target="_blank" rel="noopener"':''} aria-label="Open ${esc(r.title)}">${pdf()}</a><div class="library-content"><small>${cby(r.course).code} · ${r.type}</small><h3><a href="#${libTab==='Unlocked'?'resource/'+r.id:'admin'}">${esc(r.title)}</a></h3><div class="row between"><small>${r.status||'Unlocked · no extra charge'}</small>${libTab==='Unlocked'?`<a href="#assistant/${r.id}"><strong>Ask AI →</strong></a>`:''}</div></div></article>`).join('')||`<div class="panel empty" style="grid-column:1/-1">${libTab==='My uploads'?'No uploads yet. Upload your first resource to earn points.':'No matching resources.'}</div>`}
function adminPage(sub){if(sub)return adminOther(sub);let item=queue[selectedQueue];return `<main class="main grid admin-grid"><section><div class="section-title"><h1>Review queue</h1><small>${queue.length} pending</small></div><div class="tags" style="margin:20px 0">${['All','Flagged','Clean'].map(t=>`<button class="chip ${adminFilter===t?'active':''}" onclick="adminFilter='${t}';render()">${t} ${queue.filter(x=>t==='All'||(t==='Clean'?x.flag==='Clean':x.flag!=='Clean')).length}</button>`).join('')}</div><div class="panel list">${queue.map((x,i)=>({x,i})).filter(({x})=>adminFilter==='All'||(adminFilter==='Clean'?x.flag==='Clean':x.flag!=='Clean')).map(({x,i})=>`<button class="queue-item ${i===selectedQueue?'selected':''}" onclick="selectedQueue=${i};render()"><div><h3>${esc(x.title)}</h3><small>${x.course} · ${x.user} · ${i?i+'h ago':'12 min ago'}</small></div><span class="tag ${x.flag==='Clean'?'green':'amber'}" style="align-self:center">${x.flag}</span></button>`).join('')||'<div class="empty">No pending resources.</div>'}</div></section><section class="panel">${item?`<div class="row between"><small>${item.course} · Summary notes · Fall 2025 · Prof. Kim</small><button class="btn" onclick="openQueuePDF()">Open PDF</button></div><h1 style="font-size:27px;margin-top:15px">${esc(item.title)}</h1><p>Uploaded by ${item.user}@wisc.edu · 9 pages</p><div class="status-grid"><div class="green"><small>Exact duplicate</small><strong>None</strong></div><div class="amber"><small>Max similarity</small><strong>${item.flag==='Clean'?'18':'71'}%</strong></div><div class="green"><small>Course match</small><strong>${item.flag==='Course mismatch'?'0.24':'0.82'}</strong></div></div><p class="muted">SAMPLE REVIEW SIGNALS · NOT ACTUAL ANALYSIS</p><small>COMPARE WITH CLOSEST EXISTING RESOURCE</small><div class="form-grid" style="margin:15px 0"><div class="panel"><span class="tag">New</span><h3 style="margin-top:15px">${esc(item.title)}</h3><small>9 pages · 2,140 words</small></div><div class="panel"><span class="tag">Existing</span><h3 style="margin-top:15px">Bootstrap CI Notes</h3><small>6 pages · 1,580 words · Fall 2025</small></div></div><div class="meta"><span>Text similarity</span><strong>0.71</strong><span>Same course</span><strong>Yes</strong></div><div class="meta"><span>Title similarity</span><strong>0.64</strong><span>Same semester</span><strong>Yes</strong></div><label class="field">Note to uploader (optional)<textarea id="admin-note" placeholder="Explain your decision..." rows="3"></textarea></label><div class="row wrap" style="margin-top:22px"><button class="btn dark grow" onclick="review('Approved')">Approve · +30 pts</button><button class="btn grow" onclick="review('Duplicate')">Mark as duplicate</button><button class="btn redtext" onclick="review('Rejected')">Reject</button></div>`:'<div class="empty"><h2>All caught up</h2>No resources are waiting for review.</div>'}</section></main>`}
function review(status){let item=queue[selectedQueue];if(!item)return;let upload=state.uploads.find(x=>x.id===item.id);if(upload){upload.status=status;upload.note=$('#admin-note').value;if(status==='Approved')state.points+=30}queue.splice(selectedQueue,1);selectedQueue=Math.max(0,Math.min(selectedQueue,queue.length-1));render();toast(status+(status==='Approved'&&upload?' · 30 points added to your balance':''))}
function openQueuePDF(){let item=queue[selectedQueue];if(fileURLs.has(item.id))window.open(fileURLs.get(item.id),'_blank','noopener');else modal('<h2>Sample document</h2><p>Bootstrap resampling draws repeated samples with replacement from the observed data. The distribution of a statistic across these samples approximates its sampling variability.</p><p>This example review item has no original PDF attached.</p>')}
function adminOther(sub){let content=sub==='resources'?`<h1>Resources</h1><p>Sample resource catalog</p><div class="panel list">${resources.map(r=>resourceRow(r)).join('')}</div>`:sub==='users'?'<h1>Users</h1><div class="panel section"><div class="meta"><strong>Bucky Badger</strong><span>bucky@wisc.edu</span><span>Student · Demo account</span></div><div class="meta"><strong>Admin</strong><span>Demo reviewer</span></div></div>':`<h1>Reports</h1><div class="panel section"><h2>Review activity this visit</h2><p>${state.uploads.filter(x=>x.status==='Approved').length} approved · ${state.uploads.filter(x=>x.status==='Rejected').length} rejected · ${state.uploads.filter(x=>x.status==='Duplicate').length} duplicate</p><p>${queue.length} resources still pending review.</p></div>`;return `<main class="main narrow">${content}</main>`}
function assistantPage(id){if(id&&state.unlocked.includes(id))selectedSources.add(id);let unlocked=resources.filter(r=>state.unlocked.includes(r.id));return `<div class="chat-layout"><aside class="chat-sidebar"><small>SEARCHING IN</small>${unlocked.map(r=>`<label><input type="checkbox" ${selectedSources.has(r.id)?'checked':''} onchange="this.checked?selectedSources.add('${r.id}'):selectedSources.delete('${r.id}')"><span><strong>${r.title}</strong><br><small>${cby(r.course).code} · ${r.pages} pages</small></span></label>`).join('')}<div class="recent section"><small>RECENT CHATS</small>${['Is regression on Midterm 1?','Explain confidence intervals','SQL outer join vs inner join'].map(q=>`<button onclick="ask('${q}')">${q}</button>`).join('')}</div></aside><main class="chat-main"><div class="messages" id="messages"></div><div class="chat-input"><div class="tags">${['Summarize the resource','Make 5 practice questions','Explain residual plots'].map(q=>`<button class="chip" onclick="ask('${q}')">${q}</button>`).join('')}</div><form class="search" id="chat-form"><input name="q" aria-label="Ask assistant" placeholder="Ask about your selected resources..." required><button class="btn dark" aria-label="Send question">↑</button></form><p class="auth-note">Demo assistant · Prepared examples, not a live AI model. Only selected sample content is used.</p></div></main></div>`}
function showChats(){let node=$('#messages');node.innerHTML=chats.length?chats.map(m=>`<div class="bubble">${esc(m.q)}</div><div class="answer"><span class="mark">S</span><div><p style="color:#17191d">${esc(m.answer).replace(/\n/g,'<br>')}</p>${m.sources.length?'<small>SAMPLE SOURCES</small><div class="row wrap" style="margin-top:12px">'+m.sources.map(id=>`<a class="btn" href="#resource/${id}">${pdf()}${rby(id).title}</a>`).join('')+'</div>':''}</div></div>`).join(''):'<div class="answer"><span class="mark">S</span><div><h2>What are you studying today?</h2><p>Select resources on the left, then ask a question. Try “Explain residual plots” to explore a sample answer.</p><span class="tag">Demo assistant</span></div></div>'}
function ask(q){q=q.trim();if(!q)return;let ids=[...selectedSources].filter(id=>state.unlocked.includes(id));let r=ids.map(rby),answer='';if(!r.length)answer='Select at least one unlocked resource to use as a source.';else if(/midterm|exam/i.test(q))answer='This demo cannot confirm your real exam scope. The sample Exam 1 Study Guide describes linear regression and residual analysis. Check your instructor’s syllabus for the actual scope.';else if(/5 practice/i.test(q))answer='Practice based on the selected sample:\n1. Define the main concept in your own words.\n2. Give a concrete example.\n3. State the key assumptions.\n4. Explain how you would check your result.\n5. Describe one limitation of the method.';else if(/residual/i.test(q)&&r.some(x=>x.course==='stat340'))answer='A residual is the observed response minus its fitted value. In a residual plot, look for random scatter around zero. Curvature can suggest a nonlinear relationship; a widening pattern can suggest nonconstant variance. This is a prepared explanation of the sample regression content.';else if(/summar|regression|join|sql|eigen/i.test(q))answer=r.map(x=>x.title+': '+sampleContent(x)).join('\n\n');else answer='This frontend demo has no live AI connection. Try “Summarize the resource”, “Make 5 practice questions”, or “Explain residual plots” to see prepared responses using the selected sample content.';chats.push({q,answer,sources:ids});showChats();$('#chat-form')?.reset()}
function render(){let [page='login',id]=location.hash.slice(1).split('/');if(!['login','home','courses','course','resource','upload','admin','library','assistant'].includes(page))page='home';$('#app').innerHTML=page==='login'?login():header(page)+({home,courses:coursesPage,course:()=>coursePage(id),resource:()=>resourcePage(id),upload:()=>uploadPage(id),admin:()=>adminPage(id),library:libraryPage,assistant:()=>assistantPage(id)}[page])();document.title=`${page==='login'?'Welcome':page==='resource'?rby(id).title:page==='course'?cby(id).title:page[0].toUpperCase()+page.slice(1)} · StudySwap`;if(page==='login')$('#login-form').onsubmit=e=>{e.preventDefault();if(signup){state.points=50;toast('Demo account created · 50 starter points')}go('home')};if(page==='home')$('#home-search').onsubmit=e=>{e.preventDefault();window.courseQuery=new FormData(e.target).get('q');go('courses')};if(page==='courses'){showCourseResults();$('#course-search').onsubmit=e=>{e.preventDefault();showCourseResults()};$('#level').onchange=showCourseResults}if(page==='course'){showResources(cby(id).id);$('#resource-search').oninput=()=>showResources(cby(id).id)}if(page==='library'){showLibrary();$('#library-search').oninput=showLibrary}if(page==='upload'){currentFile=null;$('#upload-form').onsubmit=submitUpload;$('#file').onchange=e=>selectFile(e.target.files[0]);$('#dropzone').ondragover=e=>e.preventDefault();$('#dropzone').ondrop=e=>{e.preventDefault();selectFile(e.dataTransfer.files[0])};if(draft)for(let [k,v]of Object.entries(draft)){let el=$('#upload-form').elements[k];if(el&&el.type!=='file'){if(el.type==='checkbox')el.checked=!!v;else el.value=v}}}if(page==='assistant'){showChats();$('#chat-form').onsubmit=e=>{e.preventDefault();ask(new FormData(e.target).get('q'))}}}
window.addEventListener('hashchange',()=>{filter='All';render();window.scrollTo(0,0)});document.addEventListener('click',e=>{if(e.target.closest('dialog a'))$('#dialog').close()});render();
if(document.modelContext?.registerTool){try{Promise.resolve(document.modelContext.registerTool({name:'navigate_studyswap',description:'Open a StudySwap prototype screen. Does not authenticate or submit data.',inputSchema:{type:'object',properties:{page:{type:'string',enum:['home','courses','upload','library','assistant','admin']}},required:['page'],additionalProperties:false},execute:({page})=>{if(!['home','courses','upload','library','assistant','admin'].includes(page))throw new Error('Unknown screen');history.replaceState(null,'','#'+page);render();return {page}}})).catch(()=>{})}catch{}}
</script></body></html>
